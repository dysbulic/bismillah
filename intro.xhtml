<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <title>Volunteers Intro Page</title>
    <style type="text/css">
      @keyframes rainbow {
        from { background-position: 0% }
        to { background-position: 100% }
      }
      h1 {
        background-clip: text;
        color: #0000;
        text-align: center;
        font-style: italic;
        font-size: clamp(3rem, 12dvh, 6rem);
        font-weight: normal;
        margin-top: 10dvh;
        background-image: linear-gradient(
          to right,
          var(--red),
          var(--orange),
          var(--yellow),
          var(--green),
          var(--blue),
          var(--indigo),
          var(--violet),
          var(--indigo),
          var(--blue),
          var(--green),
          var(--yellow),
          var(--orange)
        );
        background-size: 200%;
        animation: rainbow 2s linear infinite;
      }
      #greetings {
        list-style: none;
        position: relative;
        height: 75svh;
      }
      #greetings > li {
        position: absolute;
        color: var(--accent);
        font-size: clamp(2rem, 7dvh, 5rem);
        width: 14ch;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Peace Corps Mauritania 2003-05</h1>
    <ul id="greetings">
      <li id="french" style="top: 10%; left: 0%">Bonjour</li>
      <li id="wolof" style="top: 20%; left: 13%">Nanga Def</li>
      <li id="hassaniya" style="top: 30%; left: 26%">Iyaak Labaas</li>
      <li id="sonike" style="top: 40%; left: 39%">An Moxo</li>
      <li id="pulaar" style="top: 50%; left: 52%">No M’Bad-da</li>
      <li id="english" style="top: 60%; left: 65%">Howdy</li>
    </ul>
  </body>
</html>
