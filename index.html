<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <title>PC-RIM 2003 Volunteer Spectacular</title>
    <link rel="stylesheet" type="text/css" href="main.css"/>
    <link rel="stylesheet" type="text/css" href="table.css"/>
    <link rel="stylesheet" type="text/css" href="customlayout.css"/>
    <link rel="shortcut icon" href="Peace Corps swoosh.svg"/>
    <script type="module">
      import { setup } from './control.js'
      document.addEventListener('DOMContentLoaded', () => {
        setup('bismillah.xml', 'holder', 'slider', 'player')
      })
    </script>
  </head>
  <body>
    <aside id="scrollbar">
      <section id="slider"></section>
    </aside>
    <main id="display">
      <section id="pictures"><div id="holder"></div></section>
      <section id="music">
        <audio id="player" controls>
          <source src="Black Eyed Peas - Let's Get Retarded.m4a"/>
        </audio>
      </section>
    </main>
  </body>
</html>
